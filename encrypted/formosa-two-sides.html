<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Formosa Plastics Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=Noto+Serif:wght@300;400;600;700&display=swap">
<style>
:root{
  --bg:#f4f5f6; --surface:#ffffff; --ink:#15181c; --ink2:#454b54; --muted:#757c86; --rule:#d9dce0;
  --w:#A65332; --r:#D5AA65; --p:#1F6FC2; --p-text:#1F6FC2; --now:#B21E72; --money:#646B36; --money-paper:#e6e7d6; --r-text:#8a6420; --money-text:#646B36;
  --edc:var(--w); --vc:var(--w); --paper:#fbfaf6;
  --f-ui:"Nunito Sans","Helvetica",sans-serif; --f-display:"Noto Serif","Georgia",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17191c; --surface:#202327; --ink:#eceef0; --ink2:#b4bac2; --muted:#8b929b; --rule:#33373d;
  --w:#D07A57; --r:#D5AA65; --p:#3F8CE0; --p-text:#5c9fe8; --now:#E0559F; --money:#8F9850; --money-paper:#2c2f22; --r-text:#e0bc7a; --money-text:#a9b26c;
  --edc:var(--w); --vc:var(--w); --paper:#1f2125; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17191c; --surface:#202327; --ink:#eceef0; --ink2:#b4bac2; --muted:#8b929b; --rule:#33373d;
  --w:#D07A57; --r:#D5AA65; --p:#3F8CE0; --p-text:#5c9fe8; --now:#E0559F; --money:#8F9850; --money-paper:#2c2f22; --r-text:#e0bc7a; --money-text:#a9b26c;
  --edc:var(--w); --vc:var(--w); --paper:#1f2125; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;overflow:hidden;display:flex;flex-direction:column}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
button{font:inherit;color:inherit}
.noise{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

header.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;padding:18px 28px 10px;flex-wrap:wrap;position:relative;z-index:10}
header.top h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.6vw,44px);line-height:1.05;letter-spacing:-.01em}
.seg{white-space:nowrap;max-width:100%;overflow-x:auto;scrollbar-width:none;display:inline-flex;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 15px;border-radius:999px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink2)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.view{flex:1;min-height:0;position:relative}

/* shared: glyph + text, set straight on the page (no boxes) */
.meta2{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.when{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kind{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.k-harm{color:var(--w)} .k-pen{color:var(--money-text)} .k-reward{color:var(--p-text)} .k-span{color:var(--w)} .k-mile{color:var(--ink2)}
.glab{font-size:12px;color:var(--ink2);line-height:1.3}
.glab b{color:var(--money-text);font-weight:800}
.em-edc{color:var(--edc);font-weight:700} .em-vc{color:var(--vc);font-weight:700} .em-money{color:var(--money-text);font-weight:700}
canvas.g{display:block;mix-blend-mode:multiply}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) canvas.g{mix-blend-mode:normal}}
:root[data-theme="dark"] canvas.g{mix-blend-mode:normal}
mark.hl{background:none;font-weight:700;color:var(--c)}
.dimmable{transition:opacity .3s}.dimmable.dim{opacity:.6}
.dot.dim,.cnode.dim{opacity:.35}
.nowv,.nowh{position:fixed;z-index:8;pointer-events:none}
.nowv{width:0;border-left:1.5px solid var(--now)}
.nowh{height:0;border-top:1.5px solid var(--now)}
.nowv b,.nowh b{position:absolute;color:#fff;background:var(--now);padding:1px 6px;border-radius:2px;font-size:11px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.nowv b{top:6px;left:0;transform:translateX(-50%)}
.nowv.short{border-left-width:3px;margin-left:-1px}
.nowv.short b{top:30px;background:none;color:var(--now);padding:0;font-size:12px}
.range{position:absolute;display:grid;gap:6px;opacity:.55;transition:opacity .25s}
.range.on{opacity:1}
.range .rt{display:flex;gap:4px 12px;flex-wrap:wrap;align-items:baseline;color:var(--w);position:sticky;left:16px;justify-self:start;max-width:min(620px,90vw)}
.range .rt .d{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.range .rt .t{font-size:14.5px;color:var(--ink);line-height:1.35;max-width:560px}
.range .rl{position:relative;height:3px;background:var(--w);border-radius:2px;opacity:.75}
.range .rl i{position:absolute;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:var(--w)}
.range .rl i:first-child{left:-5px}.range .rl i:last-child{right:-5px}
.rguide{position:absolute;width:0;border-left:1px dotted var(--w);opacity:.35}
.nowh b{left:12px;top:-10px}
@media (max-width:759px){.nowh b{left:auto;right:6px;top:-21px}}
.meta{font-size:12px;color:var(--muted);font-weight:700}
.scrap{position:relative;display:block;margin:0;cursor:zoom-in;border:0;padding:0;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.06),0 6px 16px -6px rgba(0,0,0,.25);transform:none}
.scrap img{display:block;width:100%;object-fit:cover;object-position:top}
.scrap.ph{cursor:default;background:var(--paper);border:1px dashed var(--rule);box-shadow:none;padding:10px 12px;font-size:12px;color:var(--muted);text-align:left}
.cap{font-size:11.5px;color:var(--muted);margin-top:6px}

/* ---------- A: along the line ---------- */
#va{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:thin}
#va:focus{outline:none}
.track{position:relative;height:100%}
.sidebg{position:sticky;left:0;top:0;height:100%;pointer-events:none;z-index:0}
.sidebg span{position:absolute;right:28px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;font-size:clamp(56px,9vw,128px);line-height:.9;opacity:.09}
.sidebg .h{color:var(--w)} .sidebg .r{color:var(--p)}
.track>svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.axis{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--ink)}
.tick{position:absolute;transform:translateX(-50%);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tick.big{color:var(--ink);font-weight:700;font-size:12.5px}
.blk{position:absolute;display:flex;flex-direction:column;gap:7px;transition:opacity .25s}
.blk.up{justify-content:flex-end}
.blk .rule{height:3px;width:44px;border-radius:2px;background:currentColor}
.blk p{margin:0;font-size:15px;line-height:1.5}
.blk .ghead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.blk .scrap{width:78%;margin:4px 0 2px}
.blk .scrap img{max-height:118px}
.dot{position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--bg);border:2.5px solid currentColor;transition:transform .2s}
.dot.on{transform:scale(1.5)}
.stem{position:absolute;width:0;border-left:1px solid currentColor;opacity:.55}
.chap{position:absolute;top:0;bottom:0;width:340px;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:0 24px}
.chap .n{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chap h2{margin:0;font-family:var(--f-ui);font-weight:800;font-size:34px;line-height:1.1}
.chap p{margin:0;font-family:var(--f-ui);font-size:16px;line-height:1.5;color:var(--ink2)}
.brk{position:absolute;height:0;display:flex;align-items:center;justify-content:space-between}
.brk i{display:block;width:10px;height:16px;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);transform:translateY(-50%) skewX(-24deg);margin-top:0}
.brk span{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap;transform:translateY(-50%);background:var(--bg);padding:0 4px}
.blk.gd .rule{height:4px;width:56px;border-radius:2px;background:currentColor;margin-bottom:2px}
.blk.gd .full{display:none}
.blk.gd.open .lead{display:none}
.blk.gd.open .full{display:grid;gap:7px}
.blk.gd{transition:opacity .25s}
.blk.gd.open{z-index:3;background:color-mix(in srgb,var(--bg) 92%,transparent);box-shadow:0 0 0 10px color-mix(in srgb,var(--bg) 92%,transparent)}
.blk.gd .lead{font-size:14.5px}
.alegend{max-width:calc(100vw - 16px)}
@media (max-width:700px){.alegend .lt{display:none}.alegend button{padding:4px 8px;font-size:12px}}
.blk.filt,.dot.filt{opacity:.12!important}
.alegend{position:static;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:color-mix(in srgb,var(--bg) 88%,transparent);padding:6px 8px;border-radius:999px}
.alegend .lt{font-size:12px;font-weight:700;color:var(--muted);margin:0 4px}
.alegend button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:700;border:1.5px solid transparent;color:var(--ink2)}
.alegend button i{width:10px;height:10px;border-radius:50%;background:currentColor;display:inline-block}
.alegend button span{color:var(--ink)}
.alegend button[aria-pressed="true"]{border-color:currentColor;background:color-mix(in srgb,currentColor 10%,transparent)}
.alegend button:focus-visible{outline:2px solid var(--p)}
.kcard{position:absolute;display:grid;gap:8px;transition:opacity .25s}
.kcard p{margin:0;font-size:15.5px;line-height:1.5;color:var(--ink)}
.kcard .scrap img{max-height:96px}
.kcard.dim{opacity:.55}
.kcard.hasclip{grid-template-columns:minmax(0,1fr) 220px;column-gap:22px;align-items:start}
.kcard.hasclip>*{grid-column:1}
.kcard.hasclip>.scrap{grid-column:2;grid-row:1/span 4}
.kcard.hasclip>.cap{grid-column:2;grid-row:5;margin-top:-4px}
.kcard.hasclip .scrap img{max-height:180px}
.dot.k{z-index:2}.dot.big{width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-width:3px}
.mline{position:absolute;transition:opacity .25s}
.mbtn{all:unset;display:grid;gap:3px;cursor:pointer;width:100%}
.mbtn:disabled{cursor:default}
.mbtn:focus-visible{outline:2px solid var(--p);outline-offset:3px}
.mline .d{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.mline .t{font-size:14.5px;line-height:1.4;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mline .more{font-size:12.5px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.mline.dim{opacity:.55}
.mline.exp{opacity:1;z-index:6}
.mfull{position:absolute;left:-14px;bottom:calc(100% + 8px);width:340px;display:grid;gap:8px;padding:14px 16px;background:var(--surface);border:1.5px solid currentColor;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.mfull p{margin:0;font-size:15px;line-height:1.5;color:var(--ink)}
.mfull .scrap img{max-height:150px}
.mclose{all:unset;cursor:pointer;justify-self:start;font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px;color:var(--ink2)}
.mclose:focus-visible{outline:2px solid var(--p)}
svg .nbr{fill:none;stroke:var(--ink2);stroke-width:1.2;opacity:.5}
.pnote{position:absolute;font-size:14px;line-height:1.4;color:var(--ink2);transition:color .25s}
.pnote.on{color:var(--ink);font-weight:700}
.chline{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--rule)}
.chline span{position:absolute;left:8px;bottom:120px;transform-origin:left bottom;transform:rotate(-90deg);white-space:nowrap;font-size:12px;color:var(--muted);letter-spacing:.04em}
.spanbar{position:absolute;height:6px;margin-top:5px;background:var(--w);opacity:.22;border-radius:1px}
svg .lk{fill:none;stroke:var(--ink2);stroke-width:1.3;stroke-dasharray:4 4;opacity:.7}
svg .lkt{font:600 11px var(--f-ui);fill:var(--ink2)}
.abar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:10px 20px;padding:10px 28px 14px;pointer-events:none;flex-wrap:wrap}
.abar>*{pointer-events:auto}
.tally{display:flex;gap:4px 18px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2);align-items:baseline;background:color-mix(in srgb,var(--bg) 85%,transparent);padding:4px 10px;border-radius:6px}
.tally .y{font-weight:800;letter-spacing:.05em;color:var(--muted);font-size:12px}
.tally b{font-weight:800;font-size:16px;margin-right:4px}
.pill{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:10px;align-items:center}
.minimap{position:relative;flex:1;max-width:520px;height:22px;cursor:pointer}
.minimap .bar{position:absolute;left:0;right:0;top:10px;height:2px;background:var(--rule)}
.minimap .win{position:absolute;top:5px;height:12px;border:1.5px solid var(--ink);border-radius:3px}
.minimap .lab{position:absolute;top:-6px;font-size:10px;color:var(--muted);transform:translateX(-50%)}

/* ---------- C: two sides (spine with the marks on it) ---------- */
#vc{overflow-y:auto;overflow-x:hidden}
.ctrack{position:relative;max-width:1180px;margin:0 auto}
.chead{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr 40px 1fr;align-items:end;padding:14px 20px 12px;background:var(--bg);font-weight:800;font-size:clamp(15px,1.8vw,22px);letter-spacing:.02em;text-transform:uppercase}
.chead .l{text-align:right;color:var(--w)} .chead .r{color:var(--p-text)}
.chead .m{justify-self:center;width:16px;height:16px;border:3px solid var(--ink);border-radius:50%;margin-bottom:3px}
.cspine{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--ink)}
.cdate{position:absolute;transform:translateX(-50%);background:var(--bg);padding:6px 4px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);white-space:nowrap;text-align:center;line-height:1.25;z-index:2}
.cnode{position:absolute;transform:translateX(-50%);z-index:2;display:grid;place-items:center;background:var(--bg);border:3px solid currentColor;border-radius:999px;padding:6px}
.cbox{position:absolute;background:var(--paper);border:3px solid currentColor;display:grid;z-index:1}
.cbox .scrap{transform:none;box-shadow:none;width:100%;border-bottom:3px solid currentColor}
.cbox .scrap img{max-height:190px}
.cbox .cap{display:none}
.cbox .in{padding:16px 20px 18px;display:grid;gap:6px}
.cbox p{margin:0;font-size:15.5px;line-height:1.5;color:var(--ink)}
.cbox.fill{background:color-mix(in srgb,currentColor 9%,var(--paper))}
@media (max-width:759px){.chead{grid-template-columns:1fr 30px 1fr;font-size:15px;padding:10px 0}.chead .l{text-align:left}.chead .r{text-align:right}#ctally{left:0;right:0;bottom:0;border-radius:0;background:var(--bg);border-top:1px solid var(--rule);padding:8px 14px}.cbox .in{padding:14px 16px 16px}.cbox p{font-size:15px}}
.celb{position:absolute;border:0 solid currentColor;z-index:0}
/* resting state (not being read): neutral gray frame and elbow, softer text; color returns when the magenta line reaches it */
.cbox,.cnode,.celb{transition:color .3s,border-color .3s,background-color .3s}
.cbox.rest,.cnode.rest,.celb.rest{color:var(--rule)!important}
.cbox.rest{background:var(--paper)!important}
.cbox.rest p{color:var(--ink2)}
.cbox.rest mark.hl{color:var(--ink2)!important;font-weight:600}
.cbox.rest .kind,.cbox.rest .glab{color:var(--muted)!important}
.cbox.rest .scrap img{filter:grayscale(1);opacity:.75}
.cnode.rest canvas{filter:grayscale(1);opacity:.5}
.cchap{position:absolute;left:0;right:0;text-align:center;display:grid;gap:8px;justify-items:center;padding:28px 20px;z-index:3}
.cchap .n{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cchap h2{margin:0;font-family:var(--f-ui);font-weight:800;font-size:clamp(26px,3.4vw,38px);line-height:1.1}
.cchap p{margin:0;font-family:var(--f-ui);font-size:16px;line-height:1.5;color:var(--ink2);max-width:60ch}
.cspan{display:none}/* the period's dates are in its own box; no separate marker on the spine */
.cspan::before{content:"";position:absolute;left:-7px;top:-1.5px;width:14px;height:3px;background:var(--w)}
.cspan span{position:absolute;left:14px;top:-9px;white-space:nowrap;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--w);background:var(--bg);padding:0 4px;opacity:.7;transition:opacity .3s}
.cspan.on span{opacity:1}
@media (max-width:759px){.cspan span{white-space:normal;width:140px;top:-8px;font-size:10.5px;line-height:1.25}}
#ctally{position:absolute;left:20px;bottom:14px;z-index:6}
/* ---------- D: one at a time, two sides ---------- */
#vd{overflow:hidden}
#vd .arc{position:absolute;left:0;right:0;top:0;height:32%;z-index:1}
#vd .arc svg{width:100%;height:100%;overflow:visible}
.dstage{position:absolute;left:0;right:0;top:33%;bottom:0;z-index:2;display:grid;justify-items:center;align-content:start;gap:12px;padding:0 24px 96px;overflow-y:auto;text-align:center}
.dmain{display:grid;gap:12px;justify-items:center}
.dmain .side{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.dmain .side.l{color:var(--w)} .dmain .side.r{color:var(--p-text)}
.dmain h2{margin:0;font-family:var(--f-ui);font-weight:400;font-size:clamp(18px,1.9vw,23px);line-height:1.5;max-width:46ch;text-wrap:pretty}
.dmain .row{display:flex;gap:28px;align-items:flex-start;justify-content:center;flex-wrap:wrap;max-width:1100px}
.dmain .scrap{width:280px;--rot:1.5deg;margin-top:6px}
.dmain .scrap img{max-height:190px}
.dpair{all:unset;cursor:pointer;margin-top:10px;max-width:560px;display:grid;gap:4px;padding:10px 14px;border-top:1px solid var(--rule);opacity:.6;transition:opacity .2s;text-align:center}
.dpair:hover,.dpair:focus-visible{opacity:1}
.dpair .ph{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.dpair.l .ph{color:var(--w)} .dpair.r .ph{color:var(--p-text)}
.dpair .t{font-size:14.5px;line-height:1.45;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dtal{display:flex;gap:4px 16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);align-items:baseline}
.dtal b{font-weight:800;font-size:16px;margin-right:4px}
.dtal.r{justify-content:flex-end}
.dnav{position:absolute;left:0;right:0;bottom:0;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px 18px;padding:12px 24px 16px}
.dnav .mid{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
@media (max-width:759px){
  .dstage{padding:0 18px 24px;top:30%;bottom:118px}
  .dnav{grid-template-columns:1fr 1fr;padding:8px 12px 10px;background:var(--bg);border-top:1px solid var(--rule)}
  .dnav .mid{grid-column:1/-1;order:-1}
  .dtal{font-size:11.5px}.dtal b{font-size:14px}
}
/* ---------- B: one at a time ---------- */
#vb{overflow:hidden}
.blobs{position:absolute;inset:0;overflow:hidden;z-index:0}
.blobs i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.28;transition:background 1s ease,transform 1.2s ease}
#vb .arc{position:absolute;left:0;right:0;top:0;height:30%;z-index:1}
#vb .arc svg{width:100%;height:100%;overflow:visible}
.arc .lbl{font:400 15px var(--f-ui);fill:var(--muted);text-anchor:middle;transition:opacity .4s}
.arc .lbl.cur{font:700 17px var(--f-ui);fill:var(--ink)}
.arc .sub{font:400 11px var(--f-ui);fill:var(--muted);text-anchor:middle}
.stage{position:absolute;left:0;right:0;top:31%;bottom:0;z-index:2;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;align-content:start;gap:12px;padding:0 24px 90px;overflow-y:auto;text-align:center}
.stage .gwrap{display:flex;align-items:center;justify-content:center;min-height:40px;gap:14px}
.stage h2{margin:0;font-family:var(--f-ui);font-weight:400;font-size:clamp(18px,1.9vw,23px);line-height:1.5;max-width:46ch;text-wrap:pretty}
.stage .row{display:flex;gap:28px;align-items:flex-start;justify-content:center;flex-wrap:wrap;max-width:1100px}
.stage .scrap{width:300px;--rot:1.5deg;margin-top:6px}
.stage .scrap img{max-height:200px}
.stage .fade{animation:fin .45s ease both}
@keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bnav{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 24px 16px;flex-wrap:wrap}
.bnav .mid{display:flex;gap:10px;align-items:center}
.count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.lb{position:fixed;inset:0;z-index:50;background:rgba(10,12,14,.82);display:grid;place-items:center;padding:24px}
.lb img{max-width:min(1000px,100%);max-height:84vh;display:block;background:#fff}
.lb figcaption{color:#e9e9e9;font-size:13px;margin-top:8px;text-align:center}
.lb button{position:absolute;top:14px;right:16px;font-size:14px;font-weight:700;background:#fff;color:#111;border:0;border-radius:4px;padding:6px 12px;cursor:pointer}
@media (max-width:700px){header.top{padding:12px 16px 6px}.abar{padding:8px 12px 10px}.tally{font-size:12px}.minimap{display:none}.chap h2{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* plain editorial type: no all-caps tracked micro-labels, no pills, no drop shadows */
.when,.kind,.mline .d,.range .rt .d,.cdate,.chap .n,.cchap .n,.tally .y{text-transform:none!important;letter-spacing:0!important}
.when{font-size:13px;font-weight:700}
.mline .d,.range .rt .d{font-size:13px;font-weight:700}
.cdate{font-size:14px;font-weight:700}
.chap .n,.cchap .n{font-size:14px;font-weight:700}
.chead{text-transform:none!important;letter-spacing:0!important;font-size:clamp(17px,2vw,24px)}
.tally{background:none!important;padding:0!important;border-radius:0!important}
.tally .y{font-size:13px;font-weight:700}
.scrap,.mfull{box-shadow:none!important}
.scrap{border:1px solid var(--rule)}
#ctally{background:var(--bg)!important;left:0!important;right:0!important;bottom:0!important;padding:10px 20px!important;border-top:1px solid var(--rule)!important;border-radius:0!important}
</style>
</head>

  const arcP=(rad,a0)=>`M${cx-rad*Math.sin(a0)},${cy-rad*Math.cos(a0)} A${rad},${rad} 0 0 1 ${cx+rad*Math.sin(a0)},${cy-rad*Math.cos(a0)}`;
  let h=`<path d="${arcP(R,1.2)}" fill="none" stroke="var(--w)" stroke-opacity=".45" stroke-width="1.2"/><path d="${arcP(R2,1.2)}" fill="none" stroke="var(--p)" stroke-opacity=".45" stroke-width="1.2"/>`;
  const la=Math.min(1.1,(W/2-40)/R);if(W>=700){
  h+=`<text x="${cx-R*Math.sin(la)}" y="${cy-R*Math.cos(la)-10}" style="font:800 11px var(--f-ui);letter-spacing:.08em;fill:var(--w)" text-anchor="start">HARM</text>`;
  h+=`<text x="${cx+R2*Math.sin(la)}" y="${cy-R2*Math.cos(la)+22}" style="font:800 11px var(--f-ui);letter-spacing:.08em;fill:var(--p-text)" text-anchor="end">PERMITS</text>`;}
  L.forEach((it,i)=>{const a=(i-D.i)*step;if(Math.abs(a)>1.1)return;const rad=sideOf(it)==='l'?R:R2,x=cx+rad*Math.sin(a),y=cy-rad*Math.cos(a),cur=i===D.i,col=`var(${KC[it.k]})`;
    h+=`<g data-i="${i}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${cur?7:4.5}" fill="${cur?'var(--now)':'var(--bg)'}" stroke="${cur?'var(--now)':col}" stroke-width="2"/>`;
    if(!cur&&Math.abs(i-D.i)<=3){const yr=it.span?clean(it.when).split(/\s+–\s+/).pop().replace(/^\w+\s/,''):String(Math.floor(it.y));h+=sideOf(it)==='l'?`<text class="lbl" x="${x}" y="${y-12}">${esc(yr)}</text>`:`<text class="lbl" x="${x}" y="${y+22}">${esc(yr)}</text>`}
    if(cur){const t=whenTxt(it),w=t.length*7+14;h+=`<line x1="${x}" x2="${x}" y1="${y}" y2="${H}" stroke="var(--now)" stroke-width="1.5"/><rect x="${x-w/2}" y="${y+(sideOf(it)==='l'?-34:14)}" width="${w}" height="20" rx="2" fill="var(--now)"/><text x="${x}" y="${y+(sideOf(it)==='l'?-20:28)}" text-anchor="middle" style="font:700 12px var(--f-ui);fill:#fff">${esc(t)}</text>`}
    h+='</g>'});
  svg.innerHTML=h;svg.querySelectorAll('g[data-i]').forEach(g=>g.addEventListener('click',()=>{D.i=+g.dataset.i;renderD()}))}
function stepD(d){const L=listD();let i=D.i+d;if(i<0){if(D.ch==='ch2'){D.ch='ch1';D.i=listD().length-1}else return}else if(i>=L.length){if(D.ch==='ch1'){D.ch='ch2';D.i=0}else return}else D.i=i;renderD()}
$('#dprev').addEventListener('click',()=>stepD(-1));$('#dnext').addEventListener('click',()=>stepD(1));
$$('#dch button').forEach(b=>b.addEventListener('click',()=>{D.ch=b.dataset.ch;D.i=0;renderD()}));
{let tx=null;$('#vd').addEventListener('touchstart',e=>{tx=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});$('#vd').addEventListener('touchend',e=>{if(!tx)return;const dx=e.changedTouches[0].clientX-tx[0],dy=e.changedTouches[0].clientY-tx[1];if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))stepD(dx<0?1:-1);tx=null},{passive:true})}

/* ---------- tabs, keys, clippings ---------- */
let cur='a';
function show(t){const orig=t;A.mode=t==='e'?'packed':t==='f'?'guided':t==='g'?'key':'split';if(t==='e'||t==='f'||t==='g')t='a';cur=t;['a','b','c','d','e','f','g'].forEach(k=>($('#tab-'+k)||document.createElement('i')).setAttribute('aria-selected','aefg'.includes(k)?k===orig:t===k));$('#alegend').hidden=!(orig==='f'||orig==='e');$('#vd').hidden=t!=='d';$('#va').hidden=t!=='a';$('#abar').hidden=t!=='a';$('#vb').hidden=t!=='b';$('#vc').hidden=t!=='c';$('#ctally').hidden=t!=='c';$('#aline').hidden=t!=='a';$('#cline').hidden=t!=='c';
  if(t==='a')buildA();else if(t==='c')buildC();else if(t==='d')renderD();else{placeBlobs();renderB()}}

addEventListener('keydown',e=>{if(!$('#lb').hidden){if(e.key==='Escape')closeClip();return}
  if(cur==='d'){if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='PageDown'){stepD(1);e.preventDefault()}if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'){stepD(-1);e.preventDefault()}return}
  if(cur==='b'){if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='PageDown'){stepB(1);e.preventDefault()}if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'){stepB(-1);e.preventDefault()}}
  else{const va=$('#va'),w=va.clientWidth;const d={ArrowDown:160,ArrowUp:-160,ArrowRight:160,ArrowLeft:-160,PageDown:w*.8,PageUp:-w*.8,' ':w*.8}[e.key];if(d!=null){va.scrollBy({left:d,behavior:'smooth'});e.preventDefault()}}});
let lbFrom=null;
function bindClips(root){$$('[data-clip]',root).forEach(b=>b.onclick=()=>{const it=BYID[b.dataset.clip];lbFrom=b;$('#lb-img').src=IMG[it.clip.img];$('#lb-img').alt=it.clip.head||'';$('#lb-cap').textContent=it.clip.paper+', '+it.clip.date+(it.clip.head?'. '+it.clip.head:'');$('#lb').hidden=false;$('#lb-x').focus()})}
function closeClip(){$('#lb').hidden=true;if(lbFrom)lbFrom.focus()}
$('#lb-x').addEventListener('click',closeClip);$('#lb').addEventListener('click',e=>{if(e.target.id==='lb')closeClip()});
const _buildA=buildA;buildA=function(){_buildA();bindClips($('#track'))};
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(cur==='a'){const va=$('#va'),y=A.x2y?A.x2y(va.scrollLeft+va.clientWidth*.42):null;buildA();if(y!=null)va.scrollLeft=A.y2x(y)-va.clientWidth*.42}else if(cur==='c')buildC();else if(cur==='d')renderD();else{placeBlobs();renderB()}},150)});
const redraw=()=>{for(const k in SPR)delete SPR[k];cur==='a'?buildA():cur==='c'?buildC():cur==='d'?renderD():renderB()};
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',redraw);
new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
let start='c';
show(['a','b','c','d','e','f','g'].includes(start)?start:'a');if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redraw);
</script>
